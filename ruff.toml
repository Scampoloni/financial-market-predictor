# Ruff configuration for financial-market-predictor
# https://docs.astral.sh/ruff/configuration/

line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "W"]
ignore = [
    # Scripts and app.py use sys.path.insert() before imports — intentional pattern
    "E402",
    # Allow long lines in generated/data files
    "E501",
]

[lint.per-file-ignores]
# Test files can use longer lines and assert-style comparisons
"tests/*" = ["E501"]
# Notebooks generated by build_ablation_notebook.py
"notebooks/*" = ["E402", "E501"]
